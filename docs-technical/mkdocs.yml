site_name: "SnapStock — Technical Docs"
site_description: "Architecture, API reference, and database schema for the Public Market POS backend and frontend."
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Architecture:
      - Overview: architecture/overview.md
      - Data Flow: architecture/data-flow.md
      - Unit Conversion: architecture/unit-conversion.md
  - API Reference:
      - Inventory Service: api/inventory-service.md
      - Sales Service: api/sales-service.md
      - Messaging Service: api/messaging-service.md
      - Payout Accounts: api/payouts-service.md
  - Database Schema: database.md
  - Getting Started: getting-started.md
  - Deferred Features: deferred-features.md
